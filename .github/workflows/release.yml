name: Release

# Pushing a tag like v0.1.0 builds Angelly.app and publishes it as a DMG on the
# matching GitHub release. The tag must match `.version` in build.zig.zon.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # mlugg/setup-zig still runs on the deprecated Node 20, so install Zig
      # with a script that verifies the download the same way.
      - name: Install Zig
        run: |
          brew install minisign
          scripts/install-zig.sh 0.17.0 "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Check version matches tag
        run: |
          built=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' zig-out/Angelly.app/Contents/Info.plist)
          if [ "v$built" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match app version $built (bump .version in build.zig.zon)" >&2
            exit 1
          fi

      # The Developer ID certificate and the notary API key go into a throwaway
      # keychain that the last step deletes.
      - name: Import signing credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_API_KEY_BASE64 NOTARY_API_KEY_ID NOTARY_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "$name secret is not set" >&2
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer_id.p12"
          security import "$RUNNER_TEMP/developer_id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$NOTARY_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials angelly-notary --keychain "$keychain" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER"
          rm "$RUNNER_TEMP/developer_id.p12" "$RUNNER_TEMP/notary.p8"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign, notarize and package DMG
        run: |
          dmg=$(scripts/sign-and-notarize.sh)
          # Record the bare filename so `shasum -c` works next to the download.
          (cd "$(dirname "$dmg")" && shasum -a 256 "$(basename "$dmg")") > "$dmg.sha256"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      # The app's update check reads appcast.xml from the latest release, so
      # each release's appcast only needs to describe its own DMG. It is signed
      # with the key whose public half is SUPublicEDKey in Ghostty-Info.plist.
      - name: Generate appcast
        env:
          SPARKLE_VERSION: 2.9.6
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "SPARKLE_ED_PRIVATE_KEY secret is not set" >&2
            exit 1
          fi
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-for-Swift-Package-Manager.zip" -o "$RUNNER_TEMP/sparkle.zip"
          unzip -q "$RUNNER_TEMP/sparkle.zip" -d "$RUNNER_TEMP/sparkle"
          mkdir "$RUNNER_TEMP/updates"
          cp "$DMG" "$RUNNER_TEMP/updates/"
          echo "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            -o appcast.xml "$RUNNER_TEMP/updates"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## Install

          Open the DMG and drag Angelly into Applications.
          EOF
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Angelly $GITHUB_REF_NAME" --generate-notes --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" appcast.xml --clobber

      - name: Delete signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN"
          fi
