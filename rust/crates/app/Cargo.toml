[package]
name = "angelly"
version = "0.0.0"
edition = "2021"

[dependencies]
gpui-kit = "0.9"
async-channel = "2"
terminal = { path = "../terminal" }
angelly-core = { path = "../core" }
uuid = { version = "1", features = ["v4"] }
rust-embed = "8"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
raw-window-handle = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSArray", "NSBundle", "NSData", "NSDictionary", "NSError", "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL", "NSValue", "NSProcessInfo", "NSRunLoop", "NSDate", "NSTimer", "NSThread", "NSEnumerator", "NSGeometry", "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSApplication", "NSDockTile", "NSImage", "NSMenu", "NSMenuItem", "NSPasteboard", "NSResponder", "NSRunningApplication",
    "NSScreen", "NSWindow", "NSWorkspace", "NSPanel", "NSControl", "NSView", "NSEvent", "NSAlert", "NSButton", "NSCell",
    "NSColor", "NSBezierPath", "NSVisualEffectView", "NSAppearance", "block2",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time"] }

[dev-dependencies]
tempfile = "3"
