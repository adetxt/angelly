[package]
name = "terminal"
version = "0.0.0"
edition = "2021"

[dependencies]
vt-sys = { path = "../vt-sys" }
portable-pty = "0.9"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
